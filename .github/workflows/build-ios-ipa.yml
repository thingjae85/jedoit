name: 저두잇 iPhone IPA 만들기

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: iOS 앱 빌드 (서명 전 IPA)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: 소스코드 받기
        uses: actions/checkout@v4

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: iOS 프로젝트 생성 및 패키지 설치
        run: |
          flutter create --platforms=ios --org com.thingjae85 --project-name jeoduit .
          flutter pub get

      - name: iPhone 앱 이름 및 권한 설명 설정
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 저두잇" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 미션 인증에 사용할 사진을 선택합니다." ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 미션 인증 사진과 영상을 촬영합니다." ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 미션 인증 영상을 녹화할 때 마이크를 사용합니다." ios/Runner/Info.plist
          # Google 로그인 후 Safari에서 앱으로 돌아오는 주소 (lib/config.dart의 appAuthRedirect)
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.thingjae85.jeoduit" ios/Runner/Info.plist

      - name: 빌드 이름 정하기
        run: echo "BUILD_LABEL=$(TZ=Asia/Seoul date +%m%d)-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: iOS 앱 빌드
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }} \
            --dart-define=BUILD_LABEL=$BUILD_LABEL

      - name: 빌드에 들어간 버전 확인
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" build/ios/iphoneos/Runner.app/Info.plist
          if strings build/ios/iphoneos/Runner.app/Frameworks/App.framework/App | grep -q "$BUILD_LABEL"; then
            echo "빌드 이름 $BUILD_LABEL 포함됨"
          else
            echo "::error::앱에 빌드 이름이 들어가지 않았어요"; exit 1
          fi

      - name: IPA 파일 포장
        run: |
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/jeoduit-$BUILD_LABEL.ipa" Payload

      - name: IPA 다운로드 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: jeoduit-ipa-${{ env.BUILD_LABEL }}
          path: dist/jeoduit-${{ env.BUILD_LABEL }}.ipa
          if-no-files-found: error
          retention-days: 7
