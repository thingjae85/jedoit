name: 저두잇 iPhone IPA 만들기

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: iOS 앱 빌드 (서명 전 IPA)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: 소스코드 받기
        uses: actions/checkout@v4

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: iOS 프로젝트 생성 및 패키지 설치
        run: |
          flutter create --platforms=ios --org com.thingjae85 --project-name jeoduit .
          flutter pub get

      - name: iPhone 사진 및 카메라 권한 설명 설정
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 미션 인증에 사용할 사진을 선택합니다." ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 미션 인증 사진과 영상을 촬영합니다." ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 미션 인증 영상을 녹화할 때 마이크를 사용합니다." ios/Runner/Info.plist

      - name: iOS 앱 빌드
        run: flutter build ios --release --no-codesign

      - name: IPA 파일 포장
        run: |
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/jeoduit-unsigned.ipa Payload

      - name: IPA 다운로드 파일 업로드
        uses: actions/upload-artifact@v4
        with:
          name: jeoduit-iphone-ipa
          path: dist/jeoduit-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
