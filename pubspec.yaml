name: jeoduit
description: 저두잇 - 혼자 시작하고 지인과 함께 이어가는 일상 미션 앱 (1주차 초기 시연 버전)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  image: ^4.12.0
  image_picker: ^1.2.4
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.18.3
  video_player: ^2.14.1
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/space/
    - assets/space/furniture/
    - assets/space/decor/
    - assets/space/surface/
  fonts:
    # 갈무리11 굵게 (SIL OFL 1.1, assets/fonts/Galmuri-OFL.md). 자주 쓰는 한글 2350자만 남겼다.
    - family: Galmuri
      fonts:
        - asset: assets/fonts/Galmuri11-Bold.ttf
          weight: 700
