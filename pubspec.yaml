name: jeoduit
description: 저두잇 - 혼자 시작하고 지인과 함께 이어가는 일상 미션 앱 (1주차 초기 시연 버전)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  image: ^4.12.0
  image_picker: ^1.2.4
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.0
  supabase_flutter: ^2.18.3
  video_player: ^2.14.1
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/space/
    - assets/space/furniture/
    - assets/space/decor/
    - assets/space/surface/
  fonts:
    # 페이퍼로지 (SIL OFL 1.1, assets/fonts/Paperlogy-OFL.md). 앱에서 쓰는 굵기(400~800)만 넣었다.
    # 원본에서 그림이 빈 한글 8,392자는 tools/fonts/strip_empty_glyphs.py로 목록에서 뺐다.
    # 이 글꼴에 없는 글자(드문 한글, 이모지, 일부 기호)는 기기 기본 글꼴이 대신 그린다.
    - family: Paperlogy
      fonts:
        - asset: assets/fonts/Paperlogy-4Regular.ttf
          weight: 400
        - asset: assets/fonts/Paperlogy-5Medium.ttf
          weight: 500
        - asset: assets/fonts/Paperlogy-6SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Paperlogy-7Bold.ttf
          weight: 700
        - asset: assets/fonts/Paperlogy-8ExtraBold.ttf
          weight: 800
